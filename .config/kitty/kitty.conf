# ─── fastfetch al inicio (solo primera ventana) ───
shell_integration enabled
on_resize bash -c "fastfetch --once --structure title:os:kernel:uptime:cpu:cpu_temp:gpu:gpu_temp:memory:disk:diskio:battery:shell:terminal:localip:network:packages:audio:vulkan:mesa:colors"

# ─── Transparencia + Blur ───
background_opacity 0.70
background_blur 15

# ─── Fuente: JetBrainsMono Nerd Font ───
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# ─── wallust colores dinámicos ───
include colors-wallust.conf