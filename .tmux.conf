# ─── tmux config básica ───
# Prefix: Ctrl+Space (más cómodo que Ctrl+b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Índices base 1 (más intuitivo)
set -g base-index 1
setw -g pane-base-index 1

# Recargar config: Prefix + r
bind r source-file ~/.tmux.conf \; display "tmux.conf recargado"

# Split intuitivos
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegación paneles estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize paneles
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse
set -g mouse on

# Historia
set -g history-limit 10000

# Colores truecolor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar mínima
set -g status-style bg=default,fg=colour244
set -g status-left " #S "
set -g status-right "%H:%M %d-%b "
set -g status-justify centre

# Ventana activa
setw -g window-status-current-style fg=colour39,bold
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Bordes
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Copiar modo vi
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# No renombrar ventanas automáticamente
set -g allow-rename off
set -g automatic-rename off